<div class="users-list">
  <div *ngIf="loading" class="users-list__loading">
    Cargando usuarios...
  </div>

  <table *ngIf="!loading" class="users-list__table">
    <thead>
    <tr>
      <th>Nombre</th>
      <th>Edad</th>
      <th>E-mail</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.firstName }} {{ user.lastName }}</td>
      <td>{{ user.age }}</td>
      <td>{{ user.email }}</td>
      <td class="users-list__actions">
        <button class="users-list__button" (click)="edit.emit(user)">Editar</button>
        <button class="users-list__button users-list__button--danger" (click)="requestDelete(user.id)">Eliminar</button>
      </td>
    </tr>
    <tr *ngIf="users.length === 0">
      <td colspan="4" class="users-list__empty">No hay usuarios registrados.</td>
    </tr>
    </tbody>
  </table>

  <app-confirm-dialog
    [visible]="pendingDeleteId !== null"
    message="¿Seguro que deseas eliminar este usuario?"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  ></app-confirm-dialog>
</div>
