<div class="confirm-dialog-overlay" *ngIf="visible" (click)="cancel.emit()">
  <div class="confirm-dialog" (click)="$event.stopPropagation()">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="actions">
      <button type="button" (click)="cancel.emit()">
        Cancelar
      </button>
      <button type="button" class="btn-danger" (click)="confirm.emit()">
        Eliminar
      </button>
    </div>
  </div>
</div>
